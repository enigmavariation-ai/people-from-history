<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2E9D2" />

    <!-- Primary SEO -->
    <title>People from History — Guess Historical Figures from Portraits</title>
    <meta
      name="description"
      content="A daily portrait-guessing game. Identify historical figures from progressively-revealed cropped portraits — tighter crop, higher score. 650 figures, three difficulties, no signup to play."
    />
    <meta
      name="keywords"
      content="historical figures, portrait guessing game, history puzzle, daily history game, who is this person, picture quiz, history trivia, geoguessr for history"
    />
    <meta name="author" content="Robert Fip" />
    <link rel="canonical" href="https://peoplefromhistory.com/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook / LinkedIn / Discord / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="People from History" />
    <meta property="og:title" content="People from History — Guess Historical Figures from Portraits" />
    <meta
      property="og:description"
      content="A daily portrait-guessing game. Identify historical figures from progressively-revealed cropped portraits — tighter crop, higher score."
    />
    <meta property="og:url" content="https://peoplefromhistory.com/" />
    <meta property="og:image" content="https://peoplefromhistory.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="People from History — Guess the figure from history" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="People from History — Guess Historical Figures from Portraits" />
    <meta
      name="twitter:description"
      content="A daily portrait-guessing game. Identify historical figures from progressively-revealed cropped portraits — tighter crop, higher score."
    />
    <meta name="twitter:image" content="https://peoplefromhistory.com/og-image.png" />
    <meta name="twitter:image:alt" content="People from History — Guess the figure from history" />

    <!-- Crawler hints -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- Structured data: tells search engines this is a free web game,
         which can earn a richer SERP card. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "People from History",
        "url": "https://peoplefromhistory.com/",
        "description": "A daily portrait-guessing game. Identify historical figures from progressively-revealed cropped portraits — tighter crop, higher score.",
        "applicationCategory": "Game",
        "genre": ["Puzzle", "Trivia", "Educational"],
        "operatingSystem": "Web Browser",
        "inLanguage": "en",
        "image": "https://peoplefromhistory.com/og-image.png",
        "author": {
          "@type": "Person",
          "name": "Robert Fip"
        },
        "publisher": {
          "@type": "Person",
          "name": "Robert Fip"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
